name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  backend:
    name: backend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

  frontend:
    name: frontend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OBSERVABILITY CHECKS
        run: echo "OBSERVABILITY CHECKS"

      - name: Lint (report-only)
        run: npm run lint
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: TypeScript check (report-only)
        run: npx tsc --noEmit
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Engine contract check
        run: node ../scripts/check-analysis-engine-contract.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Analysis error severity policy check
        run: node ../scripts/check-analysis-error-policy.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Environment policy check
        env:
          MULTACHECK_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: node ../scripts/check-env-policy.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Single entrypoint check
        run: node ../scripts/check-runmultacheck-entrypoint.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: BLOCKING CHECKS
        run: echo "BLOCKING CHECKS"

      - name: Build (blocking)
        run: npm run build

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    steps:
      - name: Validate required checks
        run: |
          echo "All required CI jobs succeeded:"
          echo "- frontend-ci (includes lint + tsc + build)"
          echo "- backend-ci"
          echo "merge-gate: PASS"
