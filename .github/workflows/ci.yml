name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  backend:
    name: backend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: multacheck
          POSTGRES_PASSWORD: multacheck
          POSTGRES_DB: multacheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multacheck -d multacheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://multacheck:multacheck@localhost:5432/multacheck_test?schema=public
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      APP_MODE: production
      FRONTEND_URL: http://localhost:5173
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Backend Tests
        run: |
          npm ci
          npx prisma generate
          npm run db:migrate
          npm run test:critical
          npm run test:mvp
          npm test

      - name: API integration tests
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          npm run test:integration
          npm run test:integration:mvp
          kill $SERVER_PID || true

  frontend:
    name: frontend-ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OBSERVABILITY CHECKS
        run: echo "OBSERVABILITY CHECKS"

      - name: Lint (report-only)
        run: npm run lint
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: TypeScript check (report-only)
        run: npx tsc --noEmit
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Engine contract check
        run: node ../scripts/check-analysis-engine-contract.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Analysis error severity policy check
        run: node ../scripts/check-analysis-error-policy.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Environment policy check
        env:
          MULTACHECK_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          NODE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: node ../scripts/check-env-policy.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: Single entrypoint check
        run: node ../scripts/check-runmultacheck-entrypoint.mjs
        continue-on-error: ${{ github.event_name != 'pull_request' }}

      - name: BLOCKING CHECKS
        run: echo "BLOCKING CHECKS"

      - name: Build (blocking)
        run: npm run build

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    steps:
      - name: Validate required checks
        run: |
          echo "All required CI jobs succeeded:"
          echo "- frontend-ci (includes lint + tsc + build)"
          echo "- backend-ci"
          echo "merge-gate: PASS"
