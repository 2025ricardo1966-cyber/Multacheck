# Render Blueprint — MultaCheck API
# Doc: https://render.com/docs/blueprint-spec
#
# Antes del deploy: reemplazá placeholders (NO commitear secretos reales).
# Preferible: setear valores sensibles solo en Render Dashboard → Environment.
#
# VITE_API_URL va en Vercel/frontend, no en este servicio.

services:
  - type: web
    name: multacheck-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres:YOUR_PASSWORD@db.yfriwbbkpirlgmfngtuq.supabase.co:5432/postgres
      - key: APP_MODE
        value: production
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: STRIPE_SECRET_KEY
        value: sk_test_XXXXX
      - key: STRIPE_PUBLISHABLE_KEY
        value: pk_test_XXXXX
      - key: STRIPE_WEBHOOK_SECRET
        value: whsec_XXXXX
      - key: JWT_SECRET
        value: your-jwt-secret-key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://multacheck.vercel.app
      - key: SENTRY_DSN
        value: https://XXXXX@sentry.io/XXXXX
      - key: FEATURE_ENABLE_CHECKOUT
        value: "true"
      - key: FEATURE_ENABLE_REPORT_GENERATION
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: AI_PROVIDER
        value: javascript
